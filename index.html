<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Steal A Brainrot – 2D</title>
<style>
body {
  margin:0;
  background:#0b0b0b;
  font-family:Arial;
  color:white;
}
#ui {
  position:fixed;
  top:10px; left:10px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:10px;
}
button {
  background:linear-gradient(45deg,#ff004c,#ff7a00);
  border:none;
  color:white;
  padding:8px 12px;
  margin:4px;
  border-radius:8px;
  font-weight:bold;
}
canvas { background:#222; display:block; margin:auto; }
.panel {
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:20px;
  border-radius:12px;
  display:none;
}
input { padding:6px; width:100%; margin:6px 0; }
</style>
</head>

<body>

<div id="ui">
  💰 Money: <span id="money">0</span><br>
  🧠 Brainrots: <span id="br">0</span><br>
  🔁 Rebirths: <span id="rebirth">0</span><br>
  <button onclick="openShop()">Gear Shop</button>
  <button onclick="openAdmin()">Admin</button>
</div>

<canvas id="game" width="900" height="500"></canvas>

<div class="panel" id="shop">
<h3>⚙️ Gear Shop</h3>
<button onclick="buyGear(50)">Speed Boost (50)</button><br>
<button onclick="buyGear(100)">Steal Boost (100)</button><br>
<button onclick="closeShop()">Close</button>
</div>

<div class="panel" id="admin">
<h3>👑 Admin Panel</h3>
<input id="pass" placeholder="Password">
<button onclick="loginAdmin()">Login</button>
<div id="adminControls" style="display:none">
<button onclick="money+=1000">+1000 Money</button>
<button onclick="spawnBrainrot()">Spawn Brainrot</button>
</div>
<button onclick="closeAdmin()">Close</button>
</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let money=0, brainrots=0, rebirths=0;
let speed=3, admin=false;

const player={x:450,y:250,r:12};
const keys={};

const brainrotTypes=[
 {name:"Common",value:10,color:"lime"},
 {name:"Legendary",value:50,color:"gold"},
 {name:"Mythic",value:150,color:"purple"},
 {name:"OG GOD",value:500,color:"red"}
];

let drops=[];
function spawnBrainrot(){
 let t=brainrotTypes[Math.floor(Math.random()*brainrotTypes.length)];
 drops.push({x:Math.random()*880+10,y:Math.random()*480+10,r:8,type:t});
}

for(let i=0;i<10;i++) spawnBrainrot();

const bases=[];
for(let i=0;i<6;i++){
 bases.push({
   x:i<3?50:800,
   y:80+i%3*120,
   level:1,
   locked:true
 });
}

document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function update(){
 if(keys["w"]) player.y-=speed;
 if(keys["s"]) player.y+=speed;
 if(keys["a"]) player.x-=speed;
 if(keys["d"]) player.x+=speed;

 drops.forEach((b,i)=>{
  let dx=player.x-b.x, dy=player.y-b.y;
  if(Math.hypot(dx,dy)<player.r+b.r){
    money+=b.type.value;
    brainrots++;
    drops.splice(i,1);
    spawnBrainrot();
  }
 });
}

function draw(){
 ctx.clearRect(0,0,900,500);

 ctx.fillStyle="red";
 ctx.fillRect(200,230,500,40); // red carpet

 ctx.fillStyle="cyan";
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();

 drops.forEach(b=>{
  ctx.fillStyle=b.type.color;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fill();
 });

 bases.forEach(b=>{
  ctx.fillStyle=b.locked?"gray":"green";
  ctx.fillRect(b.x-20,b.y-20,40,40);
 });
}

function loop(){
 update(); draw();
 document.getElementById("money").textContent=money;
 document.getElementById("br").textContent=brainrots;
 document.getElementById("rebirth").textContent=rebirths;
 requestAnimationFrame(loop);
}
loop();

function openShop(){document.getElementById("shop").style.display="block";}
function closeShop(){document.getElementById("shop").style.display="none";}
function buyGear(cost){
 if(money>=cost){money-=cost; speed+=0.5;}
}

function openAdmin(){document.getElementById("admin").style.display="block";}
function closeAdmin(){document.getElementById("admin").style.display="none";}
function loginAdmin(){
 if(document.getElementById("pass").value==="12345"){
  admin=true;
  document.getElementById("adminControls").style.display="block";
 }
}
</script>
</body>
</html>
