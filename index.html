<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Brain Rot Tycoon 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; font-family:Arial; background:#000 }
#ui {
  position:fixed; top:10px; left:10px;
  background:rgba(0,0,0,.6); color:#fff;
  padding:10px; border-radius:8px;
}
#shop, #admin {
  position:fixed; bottom:10px; left:10px;
  background:#fff; padding:10px;
  border-radius:8px; display:none;
  max-height:60vh; overflow:auto;
}
button { margin:3px 0; width:100%; }
#adminBtn { position:fixed; top:10px; right:10px; }
</style>
</head>
<body>

<div id="ui">
💰 Money: <span id="money">0</span><br>
🧠 Brain Rots: <span id="count">0</span><br>
<button onclick="toggleShop()">🛒 Gear Shop</button>
</div>

<button id="adminBtn" onclick="openAdmin()">ADMIN</button>

<div id="shop"></div>
<div id="admin"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ---------------- BASIC DATA ----------------
let money = 0;
let brainCount = 0;
let speedBoost = 1;
let isAdmin = false;

// Brain Rot list (editable, expandable)
const brainRots = [
 {name:"Basic Brain Rot", value:5, speed:0.01},
 {name:"Rare Brain Rot", value:20, speed:0.015},
 {name:"Legendary Dash Brain Rot", value:100, speed:0.03},
 {name:"Mythic Dash Brain Rot", value:500, speed:0.05},
 {name:"OG Brain Rot God", value:2000, speed:0.08}
];

// Gear shop
const gears = [
 {name:"Speed Gear", cost:100, effect:()=>speedBoost+=0.3},
 {name:"Mega Speed Gear", cost:500, effect:()=>speedBoost+=0.7},
];

// ---------------- UI ----------------
function updateUI(){
 document.getElementById("money").innerText = money;
 document.getElementById("count").innerText = brainCount;
}
function toggleShop(){
 let s = document.getElementById("shop");
 s.style.display = s.style.display==="block"?"none":"block";
 s.innerHTML="<b>GEAR SHOP</b><br>";
 gears.forEach(g=>{
  let b=document.createElement("button");
  b.innerText=`${g.name} - $${g.cost}`;
  b.onclick=()=>{
    if(money>=g.cost){ money-=g.cost; g.effect(); updateUI(); }
  };
  s.appendChild(b);
 });
}

// ---------------- ADMIN ----------------
function openAdmin(){
 let code = prompt("Admin Code:");
 if(code==="12345"){
  isAdmin=true;
  let a=document.getElementById("admin");
  a.style.display="block";
  a.innerHTML="<b>ADMIN PANEL</b><br>";
  brainRots.forEach(br=>{
    let b=document.createElement("button");
    b.innerText="Spawn "+br.name;
    b.onclick=()=>spawnBrain(br);
    a.appendChild(b);
  });
  let m=document.createElement("button");
  m.innerText="Give $10000";
  m.onclick=()=>{money+=10000; updateUI();}
  a.appendChild(m);
 } else alert("Wrong code");
}

// ---------------- 3D SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,6,12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// Light
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dl=new THREE.DirectionalLight(0xffffff,1);
dl.position.set(5,10,5);
scene.add(dl);

// Floor
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(50,50),
 new THREE.MeshStandardMaterial({color:0x555555})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

// Red carpet
const carpet=new THREE.Mesh(
 new THREE.BoxGeometry(6,0.1,30),
 new THREE.MeshStandardMaterial({color:0xff0000})
);
carpet.position.z=-5;
scene.add(carpet);

// 6 Bases (3 left, 3 right)
for(let i=0;i<6;i++){
 let base=new THREE.Mesh(
  new THREE.BoxGeometry(3,1,3),
  new THREE.MeshStandardMaterial({color:0x00aa00})
 );
 base.position.set(i<3?-10:10,0.5,(i%3)*6-6);
 scene.add(base);
}

// Player
const player=new THREE.Mesh(
 new THREE.BoxGeometry(1,2,1),
 new THREE.MeshStandardMaterial({color:0x0000ff})
);
player.position.y=1;
scene.add(player);

// ---------------- BRAIN ROT SPAWN ----------------
const brains=[];
function spawnBrain(br){
 const b=new THREE.Mesh(
  new THREE.SphereGeometry(0.4,16,16),
  new THREE.MeshStandardMaterial({color:0xffff00})
 );
 b.userData=br;
 b.position.set((Math.random()-0.5)*4,0.4,-18);
 scene.add(b);
 brains.push(b);
}

// auto spawn
setInterval(()=>spawnBrain(brainRots[0]),3000);

// ---------------- CONTROLS ----------------
const keys={};
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// ---------------- LOOP ----------------
function animate(){
 requestAnimationFrame(animate);

 if(keys["w"]||keys["ArrowUp"]) player.position.z-=0.15*speedBoost;
 if(keys["s"]||keys["ArrowDown"]) player.position.z+=0.15*speedBoost;
 if(keys["a"]||keys["ArrowLeft"]) player.position.x-=0.15*speedBoost;
 if(keys["d"]||keys["ArrowRight"]) player.position.x+=0.15*speedBoost;

 brains.forEach((b,i)=>{
  b.position.z+=b.userData.speed;
  if(b.position.distanceTo(player.position)<1){
    money+=b.userData.value;
    brainCount++;
    scene.remove(b);
    brains.splice(i,1);
    updateUI();
  }
 });

 renderer.render(scene,camera);
}
animate();

onresize=()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
